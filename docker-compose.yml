version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - MAX_WORKERS=2
      - API_KEY=${API_KEY:-}
    volumes:
      - reel_scout_data:/data/ReelScoutData
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: python -m rq worker --url redis://redis:6379 reels multipost
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      - reel_scout_data:/data/ReelScoutData
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G

volumes:
  redis_data:
  reel_scout_data: